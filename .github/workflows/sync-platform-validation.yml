name: Multi-device sync platform validation
on:
  workflow_dispatch:
  push:
    paths:
      - 'sync/**'
      - 'run_sync_validation.py'
      - '.github/workflows/sync-platform-validation.yml'
jobs:
  sync-probes:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Run pinned two-vault receipt and real Git probes
        run: python run_sync_validation.py
      - name: Upload evidence even when invariants fail
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: sync-evidence-${{ matrix.os }}
          path: sync-validation-*.zip
          if-no-files-found: error
